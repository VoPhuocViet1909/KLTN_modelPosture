# SINH TỰ ĐỘNG từ schemas/*.json bằng tools/build_openapi.py – đừng sửa tay
openapi: 3.1.0
info:
  title: Posture Monitor – API giữa Desktop App và Backend
  version: 1.3.0
  description: 'Thay đổi v1.3: `PUT /config/me` ghi rõ là thay toàn bộ cấu hình và các quy tắc kiểm tra (khoá lạ,
    `api_token`/`api_base_url` bị từ chối, `user_id` bị bỏ qua, kiểm chéo khoảng cách và nghiêng vai), 400 trả `VALIDATION_FAILED`
    theo trường; Socket.IO: kết nối không gửi token bị từ chối sau vài giây, server ngắt khi token hết hạn, sự kiện
    `config` là toàn bộ cấu hình; `status` chưa có ở backend.


    Thay đổi v1.2: thêm `GET /auth/me`, `POST /auth/logout`, các endpoint quản lý tài khoản `/users` và `GET /auth/.well-known/jwks.json`;
    body lỗi `Error` đổi thành `{code, message, traceId, errors}`; `login`/`refresh` thêm mã 400 và 500; thêm bảng
    mã lỗi; `MANAGER` -> `ORG_ADMIN`.


    Hợp đồng API v1.3 giữa Desktop App (edge), Web Dashboard và backend microservice.


    - Thời gian: ISO-8601 UTC (`...Z`). Body: JSON UTF-8.

    - Chống trùng: cùng `eventId` / `metricId` chỉ lưu 1 lần nhưng VẪN trả trong `accepted`.

    - Kiểm tra từng mục: mục sai schema vào `rejected`, các mục khác vẫn nhận.

    - `userId` lấy từ JWT (`sub`), không tin trường `userId` trong payload.

    - Trả lời trong 5 giây (app hết chờ sau 5 giây).


    Realtime (không mô tả được bằng OpenAPI): Socket.IO v4 tại `/socket.io/` qua Gateway (polling và WebSocket).

    - Xác thực: client gửi JWT trong `auth: {token}` lúc kết nối. Token thiếu, sai hoặc hết hạn thì server từ chối
    bằng `connect_error` với message đúng `unauthorized` (không nêu lý do). Kết nối không gửi `auth` bị từ chối
    sau tối đa vài giây (mặc định 5 giây) và trong lúc chờ không nhận sự kiện nào. Khi auth-service chưa sẵn sàng
    cũng nhận `unauthorized`: client thử lại sau.

    - Hết hạn: server tự ngắt kết nối đúng lúc token hết hạn (`exp`); client lấy token mới bằng `refresh` rồi TỰ
    kết nối lại (thư viện client không tự kết nối lại khi chính server ngắt).

    - Room: client không tự join. Server đưa socket vào `user:{sub}` (Desktop App và Dashboard của cùng user dùng
    chung) và thêm `org:{orgId}` nếu là ORG_ADMIN có tổ chức; mọi lệnh client gửi lên bị bỏ qua.

    - Sự kiện `config`: TOÀN BỘ cấu hình đã lưu của user (JSON theo schema `Config`, giống `GET /config/me`, không
    phải phần thay đổi), gửi tới `user:{sub}` sau mỗi lần `PUT /config/me` thành công, thường trong vài giây. Server
    không gửi lại bản cũ hơn bản đã gửi; sự kiện có thể trễ hoặc bị lỡ khi mất kết nối nên app vẫn gọi `GET /config/me`
    lúc khởi động.

    - Sự kiện `status` (CHƯA có ở backend, sẽ mô tả chi tiết khi làm): `{userId, deviceId, state: GOOD|BAD|AWAY|OFFLINE,
    alertType, ts}` cho Dashboard.


    Body lỗi chung: `{code, message, traceId, errors[{field, message}]}`; `errors` rỗng khi lỗi không gắn với trường
    nào. Chỉ dùng `code` để rẽ nhánh, `message` chỉ để hiển thị. Mã lỗi:


    | `code` | HTTP | Ý nghĩa |

    | --- | --- | --- |

    | `AUTH_TOKEN_MISSING` | 401 | Gateway: không có `Authorization: Bearer` |

    | `AUTH_TOKEN_INVALID` | 401 | Gateway: token sai chữ ký, sai issuer hoặc sai định dạng |

    | `AUTH_TOKEN_EXPIRED` | 401 | Gateway: token hết hạn – dùng `refresh` rồi gửi lại |

    | `AUTH_IDENTITY_MISSING` | 401 | Dịch vụ không xác định được người gọi (không còn tồn tại hoặc bị khóa) |

    | `AUTH_INVALID_CREDENTIALS` | 401 | Sai email hoặc mật khẩu, hoặc tài khoản bị khóa (không phân biệt) |

    | `AUTH_INVALID_REFRESH_TOKEN` | 401 | Refresh token không có, hết hạn hoặc đã dùng / đã thu hồi |

    | `AUTH_FORBIDDEN` | 403 | Thiếu quyền hoặc vi phạm quy tắc phạm vi (không nói rõ lý do) |

    | `USER_NOT_FOUND` | 404 | Không có user này (kể cả user của tổ chức khác) |

    | `USER_EMAIL_TAKEN` | 409 | Email đã được dùng (không phân biệt hoa thường) |

    | `VALIDATION_FAILED` | 400 | Sai ràng buộc; chi tiết theo trường trong `errors` |

    | `MALFORMED_REQUEST` | 400 | Body không phải JSON hợp lệ |

    | `INTERNAL_ERROR` | 500 | Lỗi bất ngờ phía server |

    | `HTTP_<mã>` | 4xx | Lỗi khung chung, ví dụ `HTTP_405`, `HTTP_415` |


    Các endpoint khác (telemetry, config) có thể trả thêm mã riêng, mô tả ở từng endpoint. `503 AUTH_UNAVAILABLE`
    do Gateway trả khi tạm thời không lấy được khóa kiểm token.'
servers:
- url: http://127.0.0.1:8080
  description: mock_server.py / máy dev
tags:
- name: telemetry
- name: auth
- name: users
- name: config
- name: system
paths:
  /api/v1/health:
    get:
      tags:
      - system
      summary: Kiểm tra server sống
      security: []
      description: App gọi mỗi 15 giây khi đang mất kết nối để biết lúc nào gửi bù.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    const: UP
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Đăng nhập trên Desktop App
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      description: Không cần token. Access token sống 15 phút (`expiresIn` = 900 giây); refresh token dùng một lần.
        Tài khoản bị khóa nhận cùng lỗi với sai mật khẩu.
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: '`VALIDATION_FAILED` (email sai định dạng, thiếu trường, quá dài) hoặc `MALFORMED_REQUEST`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`AUTH_INVALID_CREDENTIALS`: sai email hoặc mật khẩu, hoặc tài khoản bị khóa'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`INTERNAL_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Lấy access token mới (app chạy cả ngày)
      security: []
      description: 'Không cần token. Refresh token xoay vòng: token vừa gửi bị thu hồi, dùng lại sẽ nhận 401. Khóa
        user hoặc đổi role cũng thu hồi mọi refresh token của user đó.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
                  maxLength: 512
      responses:
        '200':
          description: Token mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: '`VALIDATION_FAILED` hoặc `MALFORMED_REQUEST`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`AUTH_INVALID_REFRESH_TOKEN`: token sai, hết hạn, đã dùng hoặc đã bị thu hồi'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`INTERNAL_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/.well-known/jwks.json:
    get:
      tags:
      - auth
      summary: Khóa công khai để kiểm access token (JWK Set)
      security: []
      description: Không cần token. Chỉ chứa khóa công khai RS256; Gateway dùng để kiểm chữ ký. Cache được 5 phút.
      responses:
        '200':
          description: JWK Set
          content:
            application/json:
              schema:
                type: object
                required:
                - keys
                properties:
                  keys:
                    type: array
                    items:
                      type: object
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Thông tin người dùng đang đăng nhập
      description: 'Quyền: `PROFILE_READ` (mọi role). Đọc từ cơ sở dữ liệu nên `role`, `orgId`, `enabled` luôn mới
        nhất, dù token được cấp trước đó.'
      responses:
        '200':
          description: Người gọi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '401':
          description: Thiếu / sai / hết hạn token (`AUTH_TOKEN_MISSING`, `AUTH_TOKEN_INVALID`, `AUTH_TOKEN_EXPIRED`
            từ Gateway). Hoặc `AUTH_IDENTITY_MISSING` nếu user không còn hoặc bị khóa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: 'Đăng xuất: thu hồi một refresh token'
      description: 'Quyền: `SESSION_LOGOUT` (mọi role). Chỉ thu hồi nếu refresh token thuộc người gọi. Luôn trả
        204, kể cả token không tồn tại hoặc của người khác (không lộ thông tin). Access token hiện tại vẫn dùng
        được đến khi hết hạn (15 phút); app nên xóa token cục bộ.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Đã xử lý
        '400':
          description: '`VALIDATION_FAILED` (thiếu `refreshToken`) hoặc `MALFORMED_REQUEST`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu / sai / hết hạn token (`AUTH_TOKEN_MISSING`, `AUTH_TOKEN_INVALID`, `AUTH_TOKEN_EXPIRED`
            từ Gateway).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users:
    get:
      tags:
      - users
      summary: Danh sách người dùng (có phân trang)
      description: 'Quyền: `USER_READ` (ORG_ADMIN, SYS_ADMIN). Phạm vi: ORG_ADMIN chỉ thấy và sửa user cùng tổ chức,
        user tổ chức khác trả 404; ORG_ADMIN không được gán role SYS_ADMIN và không được động vào tài khoản SYS_ADMIN;
        SYS_ADMIN thao tác được mọi user. ORG_ADMIN không thuộc tổ chức nào nhận 403. Sắp xếp theo thời điểm tạo,
        cũ trước.'
      parameters:
      - name: page
        in: query
        required: false
        description: Trang, bắt đầu từ 0
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        description: Số mục mỗi trang
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Một trang user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          description: '`VALIDATION_FAILED`: `page` < 0 hoặc `size` ngoài 1..100'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu / sai / hết hạn token (`AUTH_TOKEN_MISSING`, `AUTH_TOKEN_INVALID`, `AUTH_TOKEN_EXPIRED`
            từ Gateway).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`AUTH_FORBIDDEN`: role không đủ quyền hoặc vi phạm quy tắc phạm vi'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - users
      summary: Tạo người dùng
      description: 'Quyền: `USER_CREATE` (ORG_ADMIN, SYS_ADMIN). ORG_ADMIN luôn tạo trong tổ chức của mình (bỏ qua
        `orgId` trong body) và không được tạo SYS_ADMIN. SYS_ADMIN tự chọn `orgId` (có thể null). Không trả mật
        khẩu hay hash.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          description: '`VALIDATION_FAILED` (chi tiết theo trường trong `errors`) hoặc `MALFORMED_REQUEST`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu / sai / hết hạn token (`AUTH_TOKEN_MISSING`, `AUTH_TOKEN_INVALID`, `AUTH_TOKEN_EXPIRED`
            từ Gateway).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`AUTH_FORBIDDEN`: role không đủ quyền hoặc vi phạm quy tắc phạm vi'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`USER_EMAIL_TAKEN`: email đã được dùng'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/{id}:
    get:
      tags:
      - users
      summary: Chi tiết một người dùng
      description: 'Quyền: `USER_READ` (ORG_ADMIN, SYS_ADMIN). Phạm vi: ORG_ADMIN chỉ thấy và sửa user cùng tổ chức,
        user tổ chức khác trả 404; ORG_ADMIN không được gán role SYS_ADMIN và không được động vào tài khoản SYS_ADMIN;
        SYS_ADMIN thao tác được mọi user.'
      parameters:
      - &id001
        name: id
        in: path
        required: true
        description: Id người dùng (UUID)
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '401':
          description: Thiếu / sai / hết hạn token (`AUTH_TOKEN_MISSING`, `AUTH_TOKEN_INVALID`, `AUTH_TOKEN_EXPIRED`
            từ Gateway).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`AUTH_FORBIDDEN`: role không đủ quyền hoặc vi phạm quy tắc phạm vi'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`USER_NOT_FOUND`: không có user này, hoặc user thuộc tổ chức khác (với ORG_ADMIN)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/{id}/role:
    patch:
      tags:
      - users
      summary: Đổi role người dùng
      description: 'Quyền: `USER_ASSIGN_ROLE` (ORG_ADMIN, SYS_ADMIN). Phạm vi: ORG_ADMIN chỉ thấy và sửa user cùng
        tổ chức, user tổ chức khác trả 404; ORG_ADMIN không được gán role SYS_ADMIN và không được động vào tài khoản
        SYS_ADMIN; SYS_ADMIN thao tác được mọi user. Admin không được tự đổi role hay tự khóa chính mình (403).
        Đổi sang role khác sẽ thu hồi mọi refresh token của user. Nâng role chỉ có hiệu lực sau khi user đăng nhập
        lại (token cũ vẫn mang role cũ); hạ role có hiệu lực ngay với các API quản lý tài khoản.'
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: User sau khi đổi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          description: '`VALIDATION_FAILED` (chi tiết theo trường trong `errors`) hoặc `MALFORMED_REQUEST`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu / sai / hết hạn token (`AUTH_TOKEN_MISSING`, `AUTH_TOKEN_INVALID`, `AUTH_TOKEN_EXPIRED`
            từ Gateway).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`AUTH_FORBIDDEN`: role không đủ quyền hoặc vi phạm quy tắc phạm vi'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`USER_NOT_FOUND`: không có user này, hoặc user thuộc tổ chức khác (với ORG_ADMIN)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/{id}/status:
    patch:
      tags:
      - users
      summary: Khóa / mở khóa người dùng
      description: 'Quyền: `USER_UPDATE_STATUS` (ORG_ADMIN, SYS_ADMIN). Phạm vi: ORG_ADMIN chỉ thấy và sửa user
        cùng tổ chức, user tổ chức khác trả 404; ORG_ADMIN không được gán role SYS_ADMIN và không được động vào
        tài khoản SYS_ADMIN; SYS_ADMIN thao tác được mọi user. Admin không được tự đổi role hay tự khóa chính mình
        (403). Khóa (`enabled=false`) thu hồi mọi refresh token của user; mở khóa không khôi phục chúng. Access
        token đã cấp vẫn dùng được với các dịch vụ khác đến khi hết hạn (15 phút); các API quản lý tài khoản kiểm
        lại cơ sở dữ liệu nên có hiệu lực ngay.'
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
      responses:
        '200':
          description: User sau khi đổi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          description: '`VALIDATION_FAILED` (chi tiết theo trường trong `errors`) hoặc `MALFORMED_REQUEST`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu / sai / hết hạn token (`AUTH_TOKEN_MISSING`, `AUTH_TOKEN_INVALID`, `AUTH_TOKEN_EXPIRED`
            từ Gateway).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`AUTH_FORBIDDEN`: role không đủ quyền hoặc vi phạm quy tắc phạm vi'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`USER_NOT_FOUND`: không có user này, hoặc user thuộc tổ chức khác (với ORG_ADMIN)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/telemetry/batch:
    post:
      tags:
      - telemetry
      summary: Nhận một lô sự kiện + metrics từ Desktop App
      description: App gửi mỗi 5 giây (sự kiện khẩn gửi ngay), tối đa 100 mục / lô. Backend kiểm tra schema rồi
        đẩy vào Kafka, không xử lý nặng trong request.
      parameters:
      - name: X-Device-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Batch'
            example:
              schemaVersion: '1.0'
              deviceId: dev_e5e61fb5d685
              sentAt: '2026-10-03T16:11:40.120Z'
              events:
              - eventId: c287daa7-782b-4824-8bc0-bfbdb83c2d34
                eventType: ALERT_RESOLVED
                userId: null
