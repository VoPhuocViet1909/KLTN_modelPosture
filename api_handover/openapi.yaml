        '400':
          description: Body sai cấu trúc chung (không phải JSON, thiếu deviceId...) – app sẽ thử lại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu / sai / hết hạn JWT – app giữ dữ liệu, chờ đăng nhập lại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Lô quá 500 sự kiện hoặc 500 metrics – app tự chia nhỏ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quá giới hạn tần suất – app thử lại với backoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Server quá tải / bảo trì – app thử lại với backoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/config/me:
    get:
      tags:
      - config
      summary: Cấu hình của người dùng hiện tại
      description: Cấu hình của chính người gọi (`userId` lấy từ token). Chỉ trả các khoá người dùng đã lưu (khác
        mặc định); chưa lưu gì thì trả `{}`. App gộp với mặc định của nó.
      responses:
        '200':
          description: Cấu hình
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '401':
          description: Chưa đăng nhập / token hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - config
      summary: Lưu cấu hình (từ Web Dashboard)
      description: 'Body là TẤT CẢ các khoá người dùng muốn khác mặc định và THAY THẾ toàn bộ bản cũ: khoá không
        gửi trở về mặc định, `{}` xoá hết tuỳ chỉnh. Trả 200 với cấu hình đã lưu.


        Kiểm tra (sai thì 400 `VALIDATION_FAILED` với `errors[{field, message}]`, không trả lại giá trị bị từ chối,
        không lưu gì):

        1. Kiểu và min/max theo schema `Config` (`null` chỉ ở khoá cho phép).

        2. `api_token`, `api_base_url` là cấu hình riêng trên máy: gửi lên bị từ chối.

        3. `user_id` bị bỏ qua (không lưu, không báo lỗi).

        4. Khoá không có trong schema `Config` bị từ chối.

        5. Chỉ khi body có đủ cả hai khoá của cặp: `distance_off_cm >= distance_on_cm`; `shoulder_tilt_off <= shoulder_tilt_on`
        (khi cả hai khác null). Cặp có khoá đã sai ở bước trước thì không kiểm chéo.


        Body không phải JSON: 400 `MALFORMED_REQUEST`. Lưu xong backend đẩy sự kiện Socket.IO `config` (toàn bộ
        cấu hình) tới room `user:{sub}`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
      responses:
        '200':
          description: Đã lưu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '400':
          description: '`VALIDATION_FAILED` (chi tiết theo trường) hoặc `MALFORMED_REQUEST`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Chưa đăng nhập / token hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Event:
      title: Posture event (Desktop App -> server)
      type: object
      required:
      - eventId
      - eventType
      - deviceId
      - sessionId
      - ts
      - appVersion
      properties:
        eventId:
          type: string
          format: uuid
          description: khoá chống trùng (idempotency)
        eventType:
          enum:
          - SESSION_START
          - SESSION_END
          - CALIBRATED
          - ALERT_STARTED
          - ALERT_REPEATED
          - ALERT_RESOLVED
          - USER_AWAY
          - USER_BACK
          - REMINDER
          - CONFIG_APPLIED
        userId:
          type:
          - string
          - 'null'
        deviceId:
          type: string
          minLength: 1
        sessionId:
          type: string
          minLength: 1
        ts:
          type: string
          format: date-time
        alertType:
          enum:
          - NECK_TRUNK
          - SHOULDER_TILT
          - TOO_CLOSE
          - SIT_TOO_LONG
          - EYE_BREAK
        severity:
          enum:
          - LOW
          - MEDIUM
          - HIGH
        level:
          type: integer
          minimum: 1
          maximum: 3
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
        durationSec:
          type:
          - number
          - 'null'
          minimum: 0
        reason:
          enum:
          - CORRECTED
          - AWAY
          - RECALIBRATE
          - SESSION_END
          - RESET
        snapshot:
          type: object
          properties:
            pBad:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 1
            neck:
              type:
              - number
              - 'null'
            trunk:
              type:
              - number
              - 'null'
            headPitch:
              type:
              - number
              - 'null'
            rulaB:
              type:
              - integer
              - 'null'
              enum:
              - 0
              - 1
              - null
            tiltRel:
              type:
              - number
              - 'null'
            distanceCm:
              type:
              - number
              - 'null'
              minimum: 0
        modelVersion:
          type:
          - string
          - 'null'
        appVersion:
          type: string
        config:
          type: object
        awaySec:
          type:
          - number
          - 'null'
          minimum: 0
        sittingMin:
          type:
          - number
          - 'null'
          minimum: 0
        changedKeys:
          type: array
          items:
            type: string
        alertCount:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        frontCam:
          type: boolean
          description: 'SESSION_START: có cam laptop (đo lệch vai + khoảng cách) không'
        side:
          enum:
          - left
          - right
          description: 'CALIBRATED: cam hông đang thấy phía nào của người'
        baseline:
          type: object
          required:
          - neck
          - trunk
          - headPitch
          description: 'CALIBRATED: góc lúc ngồi chuẩn (độ); các góc trong snapshot là so với mốc này'
          properties:
            neck:
              type: number
            trunk:
              type: number
            headPitch:
              type:
              - number
              - 'null'
        shoulderTiltBase:
          type:
          - number
          - 'null'
          description: 'CALIBRATED: độ lệch vai lúc ngồi chuẩn (độ), null nếu không có cam laptop'
        distanceCm:
          type:
          - number
          - 'null'
          minimum: 0
          description: 'CALIBRATED: khoảng cách mắt–màn hình lúc ngồi chuẩn (cm)'
        distanceMethod:
          enum:
          - iris
          - ipd
          - null
          description: 'cách đo khoảng cách: mống mắt / khoảng cách 2 mắt / không đo'
        focalPx:
          type:
          - number
          - 'null'
          minimum: 0
          description: 'CALIBRATED: tiêu cự camera laptop (px) nếu đã hiệu chỉnh'
      allOf:
      - if:
          properties:
            eventType:
              const: ALERT_STARTED
          required:
          - eventType
        then:
          required:
          - alertType
          - severity
          - startedAt
      - if:
          properties:
            eventType:
              const: ALERT_REPEATED
          required:
          - eventType
        then:
          required:
          - alertType
          - severity
          - startedAt
          - durationSec
      - if:
          properties:
            eventType:
              const: ALERT_RESOLVED
          required:
          - eventType
        then:
          required:
          - alertType
          - startedAt
          - endedAt
          - durationSec
          - reason
      - if:
          properties:
            eventType:
              const: REMINDER
          required:
          - eventType
        then:
          required:
          - alertType
          - severity
          properties:
            alertType:
              enum:
              - SIT_TOO_LONG
              - EYE_BREAK
      - if:
          properties:
            eventType:
              const: USER_BACK
          required:
          - eventType
        then:
          required:
          - awaySec
      - if:
          properties:
            eventType:
              const: CONFIG_APPLIED
          required:
          - eventType
        then:
          required:
          - changedKeys
      - if:
          properties:
            eventType:
              const: SESSION_END
          required:
          - eventType
        then:
          required:
          - durationSec
      - if:
          properties:
            eventType:
              const: CALIBRATED
          required:
          - eventType
        then:
          required:
          - side
          - baseline
      - if:
          properties:
            eventType:
              const: SESSION_START
          required:
          - eventType
        then:
          required:
          - frontCam
    Metrics:
      title: Posture metrics, 1 bản / cửa sổ 60 giây
      type: object
      required:
      - metricId
      - deviceId
      - sessionId
      - windowStart
      - windowSec
      - coveredSec
      - samples
      - presenceSec
      - postureScore
      properties:
        metricId:
          type: string
          format: uuid
          description: 'uuid5(sessionId + windowStart): gửi lại vẫn trùng id'
        userId:
          type:
          - string
          - 'null'
        deviceId:
          type: string
        sessionId:
          type: string
        windowStart:
          type: string
          format: date-time
        windowSec:
          type: integer
          minimum: 1
        coveredSec:
          type: number
          minimum: 0
        samples:
          type: integer
          minimum: 0
        presenceSec:
          type: number
          minimum: 0
        goodRatio:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        pBadMean:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        neckMean:
          type:
          - number
          - 'null'
        neckMax:
          type:
          - number
          - 'null'
        trunkMean:
          type:
          - number
          - 'null'
        trunkMax:
          type:
          - number
          - 'null'
        headPitchMean:
          type:
          - number
          - 'null'
        tiltRelMean:
          type:
          - number
          - 'null'
        tiltAbsMax:
          type:
          - number
          - 'null'
          minimum: 0
        shoulderBadRatio:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        distanceMeanCm:
          type:
          - number
          - 'null'
          minimum: 0
        distanceMinCm:
          type:
          - number
          - 'null'
          minimum: 0
        tooCloseRatio:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        alertCount:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        postureScore:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
        modelVersion:
          type:
          - string
          - 'null'
        appVersion:
          type: string
    Batch:
      title: POST /api/v1/telemetry/batch
      type: object
      required:
      - schemaVersion
      - deviceId
      - sentAt
      - events
      - metrics
      properties:
        schemaVersion:
          const: '1.0'
        deviceId:
          type: string
        sentAt:
          type: string
          format: date-time
        events:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Event'
        metrics:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Metrics'
    Config:
      title: Cấu hình Desktop App (server -> app, app_config.json)
      type: object
      properties:
        user_id:
          type:
          - string
          - 'null'
        alert_sec:
          type: number
          minimum: 1
          maximum: 120
        clear_sec:
          type: number
          minimum: 0.5
          maximum: 60
        repeat_sec:
          type: number
          minimum: 0
          maximum: 3600
        cooldown_sec:
          type: number
          minimum: 0
          maximum: 3600
        p_bad_threshold:
          type:
          - number
          - 'null'
          minimum: 0.05
          maximum: 0.95
        p_bad_hysteresis:
          type: number
          minimum: 0
          maximum: 0.4
        shoulder_tilt_on:
          type:
          - number
          - 'null'
          minimum: 0.5
          maximum: 30
        shoulder_tilt_off:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 30
        distance_on_cm:
          type: number
          minimum: 20
          maximum: 120
        distance_off_cm:
          type: number
          minimum: 20
          maximum: 130
        calib_distance_cm:
          type:
          - number
          - 'null'
          minimum: 20
          maximum: 150
        camera_focal_px:
          type:
          - number
          - 'null'
          minimum: 50
          maximum: 5000
        camera_hfov_deg:
          type: number
          minimum: 30
          maximum: 120
        away_sec:
          type: number
          minimum: 5
          maximum: 600
        sit_limit_min:
          type: number
          minimum: 0
          maximum: 240
        sit_repeat_min:
          type: number
          minimum: 1
          maximum: 120
        eye_break_min:
          type: number
          minimum: 0
          maximum: 120
        notify_toast:
          type: boolean
        notify_sound:
          type: boolean
        notify_popup:
          type: boolean
        calib_sec:
          type: number
          minimum: 3
          maximum: 60
        api_base_url:
          type:
          - string
          - 'null'
        api_token:
          type:
          - string
          - 'null'
        batch_interval_sec:
          type: number
          minimum: 1
          maximum: 300
        batch_max:
          type: integer
          minimum: 1
          maximum: 500
        metrics_window_sec:
          type: integer
          minimum: 10
          maximum: 600
    BatchResult:
      type: object
      required:
      - accepted
      - rejected
      properties:
        accepted:
          type: array
          items:
            type: string
          description: id đã lưu, kể cả id trùng đã lưu trước đó
        rejected:
          type: array
          items:
            type: object
            required:
            - id
            - reason
            properties:
              id:
                type:
                - string
                - 'null'
              reason:
                type: string
          description: id sai schema – app KHÔNG gửi lại
        duplicates:
          type: integer
          minimum: 0
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 200
        deviceId:
          type: string
          maxLength: 128
        deviceName:
          type: string
          maxLength: 200
    TokenPair:
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresIn
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: giây
    LoginResponse:
      allOf:
      - $ref: '#/components/schemas/TokenPair'
      - type: object
        required:
        - user
        properties:
          user:
            type: object
            required:
            - id
            - role
            properties:
              id:
                type: string
              name:
                type: string
              orgId:
                type:
                - string
                - 'null'
              role:
                enum:
                - USER
                - ORG_ADMIN
                - SYS_ADMIN
    Error:
      type: object
      required:
      - code
      - message
      - errors
      properties:
        code:
          type: string
          description: mã ổn định cho máy xử lý, xem bảng mã lỗi ở đầu tài liệu
        message:
          type: string
          description: câu hiển thị, không dùng để rẽ nhánh logic
        traceId:
          type:
          - string
          - 'null'
          description: mã vết của request, dùng để tra log
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldProblem'
          description: lỗi theo từng trường; rỗng nếu lỗi không gắn với trường
    FieldProblem:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
          description: tên trường sai
        message:
          type: string
          description: lý do; không bao giờ chứa giá trị đã gửi
    UserAccount:
      type: object
      required:
      - id
      - email
      - role
      - enabled
      properties:
        id:
          type: string
          description: UUID; bằng `sub` của access token
        email:
          type: string
        name:
          type:
          - string
          - 'null'
        role:
          enum:
          - USER
          - ORG_ADMIN
          - SYS_ADMIN
        orgId:
          type:
          - string
          - 'null'
          description: null nếu user không thuộc tổ chức nào
        enabled:
          type: boolean
          description: false = tài khoản bị khóa
    UserPage:
      type: object
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserAccount'
        page:
          type: integer
          description: trang, bắt đầu từ 0
        size:
          type: integer
          description: kích thước trang yêu cầu (tối đa 100)
        total:
          type: integer
          description: tổng số user người gọi được thấy
    CreateUserRequest:
      type: object
      required:
      - email
      - password
      - role
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: duy nhất, không phân biệt hoa thường
        password:
          type: string
          minLength: 8
          maxLength: 200
          description: 8 ký tự – tối đa 72 byte UTF-8 (giới hạn của BCrypt); quá 72 byte trả 400
        name:
          type: string
          maxLength: 200
        role:
          enum:
          - USER
          - ORG_ADMIN
          - SYS_ADMIN
          description: ORG_ADMIN không được gán SYS_ADMIN
        orgId:
          type:
          - string
          - 'null'
          format: uuid
          description: bị bỏ qua nếu người gọi là ORG_ADMIN (luôn là tổ chức của họ)
    ChangeRoleRequest:
      type: object
      required:
      - role
      properties:
        role:
          enum:
          - USER
          - ORG_ADMIN
          - SYS_ADMIN
    ChangeStatusRequest:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: false = khóa và thu hồi mọi refresh token
    LogoutRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          maxLength: 512
security:
- bearerAuth: []
