name: Windows portable verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'posture_model/**'
      - 'release/**'
      - '.github/workflows/windows-release.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build project portable
        shell: cmd
        run: |
          py -3.11 -m venv .venv
          if errorlevel 1 exit /b 1
          call .venv\Scripts\activate.bat
          python -m pip install -r posture_model\requirements.txt pyinstaller==6.22.3
          if errorlevel 1 exit /b 1
          call posture_model\build_exe.bat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: PostureMonitor-Windows
          path: |
            posture_model/dist/PostureMonitor/
            release/Install-PostureMonitor.ps1
          if-no-files-found: error
          retention-days: 7
  clean-install:
    needs: package
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch the built application
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: PostureMonitor-Windows
          path: package
      - name: Verify install, upgrade and rollback without a development environment
        run: ./release/Test-PostureRelease.ps1 -Package ./package/posture_model/dist/PostureMonitor
